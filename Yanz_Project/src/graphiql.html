<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GraphQL Playground - Penyewaan</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .ep { font-family: Consolas, monospace; font-size: 12px; color: #94a3b8; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #334155; min-height: 0; }
  section { background: #0f172a; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1e293b; border-bottom: 1px solid #334155; }
  .bar span { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 5px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button.ghost { background: #334155; }
  button.ghost:hover { background: #475569; }
  textarea { flex: 1; width: 100%; resize: none; border: 0; outline: 0; background: #0f172a; color: #e2e8f0; font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.55; padding: 12px 14px; }
  pre { flex: 1; margin: 0; overflow: auto; padding: 12px 14px; font-family: Consolas, monospace; font-size: 12.5px; line-height: 1.5; color: #a5f3fc; white-space: pre-wrap; word-break: break-word; }
  pre.err { color: #fca5a5; }
  .vars { height: 92px; border-top: 1px solid #334155; }
  .vars textarea { font-size: 12px; }
  .status { font-size: 11px; color: #64748b; margin-left: auto; font-family: Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>GraphQL Playground</h1>
  <span class="ep">POST http://localhost:3000/graphql</span>
</header>
<main>
  <section>
    <div class="bar">
      <span>Query</span>
      <button id="run">Run (Ctrl+Enter)</button>
      <button class="ghost" id="sample">Contoh</button>
      <span class="status" id="status">siap</span>
    </div>
    <textarea id="query" spellcheck="false">query DataPenyewaan {
  rental(id: 1) {
    rentalDate
    totalCost
    customer {
      name
    }
    vehicle {
      brand
    }
  }
}</textarea>
    <div class="vars">
      <div class="bar"><span>Variables (JSON)</span></div>
      <textarea id="vars" spellcheck="false">{}</textarea>
    </div>
  </section>
  <section>
    <div class="bar"><span>Response</span></div>
    <pre id="out">Tekan Run untuk menjalankan query.</pre>
  </section>
</main>
<script>
  const elQuery = document.getElementById('query');
  const elVars = document.getElementById('vars');
  const elOut = document.getElementById('out');
  const elStatus = document.getElementById('status');

  const SAMPLES = [
    'query DataPenyewaan {\n  rental(id: 1) {\n    rentalDate\n    totalCost\n    customer { name }\n    vehicle { brand }\n  }\n}',
    'query DataTransaksi {\n  transaction(id: 1) {\n    id\n    amount\n    method\n    customer { name }\n    rental {\n      rentalDate\n      totalCost\n      vehicle { brand plate }\n    }\n  }\n}',
    'query SemuaRental {\n  rentals {\n    id\n    rentalDate\n    totalCost\n    customer { name }\n    vehicle { brand plate }\n  }\n}'
  ];
  let sampleIndex = 0;

  async function run() {
    elStatus.textContent = 'mengirim...';
    elOut.className = '';
    elOut.textContent = '';
    let variables = null;
    try {
      variables = JSON.parse(elVars.value || '{}');
    } catch (e) {
      elOut.className = 'err';
      elOut.textContent = 'Variables bukan JSON valid: ' + e.message;
      elStatus.textContent = 'error';
      return;
    }
    const started = performance.now();
    try {
      const res = await fetch('/graphql', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ query: elQuery.value, variables })
      });
      const json = await res.json();
      const ms = Math.round(performance.now() - started);
      elOut.textContent = JSON.stringify(json, null, 2);
      elOut.className = json.errors ? 'err' : '';
      elStatus.textContent = res.status + ' - ' + ms + ' ms';
    } catch (e) {
      elOut.className = 'err';
      elOut.textContent = 'Gagal menghubungi server: ' + e.message;
      elStatus.textContent = 'gagal';
    }
  }

  document.getElementById('run').addEventListener('click', run);
  document.getElementById('sample').addEventListener('click', () => {
    sampleIndex = (sampleIndex + 1) % SAMPLES.length;
    elQuery.value = SAMPLES[sampleIndex];
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  });
</script>
</body>
</html>
