<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apollo Sandbox - API Penyewaan</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #sandbox { width: 100vw; height: 100vh; }
    noscript { display: block; padding: 24px; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="sandbox"></div>
  <noscript>Aktifkan JavaScript untuk membuka Apollo Sandbox.</noscript>
  <script src="https://embeddable-sandbox.cdn.apollographql.com/v2/embeddable-sandbox.umd.production.min.js"></script>
  <script>
    var sampleQuery = "query DataPenyewaan {\n  rental(id: 1) {\n    rentalDate\n    totalCost\n    customer {\n      name\n    }\n    vehicle {\n      brand\n    }\n  }\n}";
    if (window.EmbeddedSandbox) {
      new window.EmbeddedSandbox({
        target: '#sandbox',
        initialEndpoint: window.location.origin + '/graphql',
        initialState: { document: sampleQuery },
        hideCookieToggle: true,
        endpointIsEditable: false
      });
    }
  </script>
</body>
</html>
